services:
  fish-web:
    build:
      context: .
      dockerfile: Dockerfile
    image: opfish-web:latest
    env_file:
      - path: ${FISH_ENV_FILE:-.env.production}
        required: false
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    ports:
      - "3000:3000"
    volumes:
      - fish-submissions:/app/data/submissions
      - fish-ledger:/app/data/fish
      - fish-ocean-batch:/app/data/ocean-batch
      - fish-proof:/app/data/proof
      - fish-staking:/app/data/staking
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  fish-submissions:
  fish-ledger:
  fish-ocean-batch:
  fish-proof:
  fish-staking:
