services:
  fish-api:
    image: python:3.11-slim
    working_dir: /app/backend
    command: python3 server.py
    volumes:
      - .:/app
    ports:
      - "8787:8787"
  fish-static:
    image: python:3.11-slim
    working_dir: /app/app
    command: python3 -m http.server 5173
    volumes:
      - .:/app
    ports:
      - "5173:5173"
