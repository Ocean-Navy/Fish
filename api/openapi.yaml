openapi: 3.0.3
info:
  title: Fish Landing + Dashboard API
  version: 0.1.0
  description: API contract for the Fish landing page, Ocean Network supply dashboard, provider pilot, and waitlist.
servers:
  - url: http://127.0.0.1:3000
paths:
  /api/health:
    get:
      summary: Health check
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  service:
                    type: string
                  timestamp:
                    type: string
  /api/ocean/summary:
    get:
      summary: Aggregate Ocean Network compute supply and usage summary
      responses:
        '200':
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OceanSummary'
  /api/ocean/resources:
    get:
      summary: Normalized compute resources
      responses:
        '200':
          description: Resource list
          content:
            application/json:
              schema:
                type: object
                properties:
                  dataState:
                    type: string
                    enum: [live, snapshot, sample, unavailable]
                  lastUpdated:
                    type: string
                  resources:
                    type: array
                    items:
                      $ref: '#/components/schemas/ComputeResource'
  /api/ocean/providers:
    get:
      summary: Provider scorecard
      responses:
        '200':
          description: Provider list
          content:
            application/json:
              schema:
                type: object
                properties:
                  dataState:
                    type: string
                    enum: [live, snapshot, sample, unavailable]
                  lastUpdated:
                    type: string
                  providers:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProviderScore'
  /api/ocean/provider-readiness:
    post:
      summary: Admin-only selected Ocean provider readiness check
      description: Checks selected-provider route config, provider proof allowlist state, `/models`, and optionally one tiny chat probe without returning endpoint URLs, API keys, prompt text, or output text.
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                probeModels:
                  type: boolean
                  default: true
                probeChat:
                  type: boolean
                  default: false
                  description: When true, sends one tiny chat request to the selected provider route. This may incur provider cost.
                timeoutMs:
                  type: integer
                  minimum: 250
                  maximum: 30000
                  default: 3000
                workloadType:
                  type: string
                  default: chat_batch
                model:
                  type: string
                  description: Optional proof-job model to check against the provider allowlist.
      responses:
        '200':
          description: Selected-provider readiness result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OceanProviderReadiness'
        '400':
          description: Invalid readiness request
        '401':
          description: Admin token required
  /api/dashboard/summary:
    get:
      summary: Unified public Fish dashboard summary
      description: Combines Fish usage, active route status, warm AI readiness, Ocean supply, and public-safe proof counters without prompts, outputs, endpoint URLs, or API keys.
      responses:
        '200':
          description: Fish dashboard summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FishDashboardSummary'
  /api/ocean/batch/jobs:
    get:
      summary: Public-safe Ocean batch job summary
      description: Lists recent Ocean batch receipts without prompt text, output text, endpoint URLs, API keys, or private provider contact data.
      responses:
        '200':
          description: Ocean batch summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OceanBatchSummary'
    post:
      summary: Submit a capped Ocean batch job
      description: Fish API-key route for batch dish jobs. The request accepts input references only; raw dish input and full output text are not accepted or stored by this contract.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OceanBatchJobRequest'
      responses:
        '200':
          description: Ocean batch job completed
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  receipt:
                    $ref: '#/components/schemas/OceanBatchReceipt'
                  usageReceipt:
                    $ref: '#/components/schemas/FishUsageReceipt'
                  creditsRemaining:
                    type: integer
                  budget:
                    $ref: '#/components/schemas/OceanBatchBudgetState'
                  quota:
                    $ref: '#/components/schemas/FishQuotaState'
                  monthlyRequests:
                    $ref: '#/components/schemas/FishMonthlyRequestState'
                  rateLimit:
                    type: object
                    properties:
                      remaining:
                        type: integer
                      resetAt:
                        type: string
        '401':
          description: Fish API key required
        '402':
          description: Insufficient Fish Credits
        '429':
          description: Ocean batch daily budget, monthly request limit, daily quota, or minute rate limit exceeded
        '502':
          description: Ocean batch backend failed
        '504':
          description: Ocean batch backend timed out
  /api/ocean/batch/readiness:
    get:
      summary: Public-safe Ocean batch proof readiness
      description: Milestone 3 readiness gate for the private Ocean workload adapter and successful non-sample Ocean batch receipts. Does not expose adapter URLs, wallet secrets, API keys, prompt text, or output text.
      responses:
        '200':
          description: Ocean batch proof readiness
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OceanProofReadiness'
  /api/routing/policy:
    get:
      summary: Public Fish routing policy
      description: Public-safe route compass for mock chat, external fallback, selected Ocean providers, future privacy stages, and receipt rules. It does not expose secrets.
      responses:
        '200':
          description: Route policy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FishRoutePolicy'
  /api/warm/status:
    get:
      summary: Public-safe warm inference status
      description: Shows whether the configured warm demo route is ready without exposing endpoint URLs, API keys, prompts, or outputs.
      responses:
        '200':
          description: Warm route status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WarmInferenceStatus'
  /api/features:
    get:
      summary: Public Fish AI menu
      description: Lists simple Fish menu dishes, model aliases, route labels, caps, and feature policy without exposing prompts or backend secrets.
      responses:
        '200':
          description: Fish feature menu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FishFeatureMenu'
  /api/dishes/{dishId}/run:
    post:
      summary: Run a Fish AI menu dish
      description: Runs a menu dish such as ask, code, docs, repo, eval, data, proposal, or ocean with server-side prompts. Batch dishes return public-safe ticket metadata. Uses guest credits when no bearer key is provided and Fish API-key credits when authorization is present.
      parameters:
        - in: path
          name: dishId
          required: true
          schema:
            type: string
            enum: [ask, code, explain, docs, repo, eval, data, images, proposal, ocean]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FishDishRunRequest'
      responses:
        '200':
          description: Fish dish run completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FishChatCompletion'
        '400':
          description: Invalid dish request
        '401':
          description: Invalid bearer key when one is supplied
        '402':
          description: Insufficient Fish Credits
        '404':
          description: Fish dish not found
        '501':
          description: Fish dish not enabled
  /api/meal/order:
    post:
      summary: Guest Fish meal-counter order
      description: Capped guest route for the public meal counter. Uses the same chat request shape without exposing a Fish API key.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FishChatRequest'
      responses:
        '200':
          description: Meal order completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FishChatCompletion'
  /api/billing/plans:
    get:
      summary: Public Fish plan catalog
      description: Prototype/future plan metadata with limits and routing permissions. This does not enable checkout.
      responses:
        '200':
          description: Plan catalog
          content:
            application/json:
              schema:
                type: object
                properties:
                  object:
                    type: string
                    example: list
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/FishPlan'
  /api/billing/subscriptions:
    post:
      summary: Admin-only pilot subscription activation
      description: Activates a pilot plan for an existing Fish account, writes subscription credit entries, and keeps public checkout future-gated.
      security:
        - adminToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FishSubscriptionActivationRequest'
      responses:
        '200':
          description: Subscription activated, or an idempotent duplicate was ignored
          content:
            application/json:
              schema:
                type: object
                properties:
                  object:
                    type: string
                    example: subscription_activation
                  idempotent:
                    type: boolean
                  plan:
                    $ref: '#/components/schemas/FishPlan'
                  account:
                    $ref: '#/components/schemas/FishAccount'
                  entry:
                    $ref: '#/components/schemas/FishCreditEntry'
                  creditsRemaining:
                    type: integer
        '400':
          description: Invalid subscription activation request
        '401':
          description: Admin token required
        '404':
          description: Fish account not found
  /api/billing/topups:
    post:
      summary: Admin-only Fish credit top-up
      description: Adds pilot credits to an existing account and writes an immutable credit ledger entry. This is not public checkout.
      security:
        - adminToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FishCreditTopupRequest'
      responses:
        '200':
          description: Credits added, or an idempotent duplicate was ignored
          content:
            application/json:
              schema:
                type: object
                properties:
                  object:
                    type: string
                    example: credit_topup
                  idempotent:
                    type: boolean
                  account:
                    $ref: '#/components/schemas/FishAccount'
                  entry:
                    $ref: '#/components/schemas/FishCreditEntry'
                  creditsRemaining:
                    type: integer
        '400':
          description: Invalid top-up request
        '401':
          description: Admin token required
        '404':
          description: Fish account not found
  /api/billing/checkout/stripe:
    post:
      summary: Create a Stripe Checkout session for Fish Credits
      description: Fish API-key route that creates a prepaid credit checkout session. Credits are issued only after the signed Stripe webhook confirms payment.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FishCheckoutRequest'
      responses:
        '200':
          description: Checkout session created
          content:
            application/json:
              schema:
                type: object
                properties:
                  object:
                    type: string
                    example: fish_checkout
                  idempotent:
                    type: boolean
                  payment:
                    $ref: '#/components/schemas/FishPaymentRequest'
                  checkoutUrl:
                    type: string
                    nullable: true
        '400':
          description: Invalid checkout request
        '401':
          description: Fish API key required
        '503':
          description: Stripe checkout is not configured
  /api/billing/webhooks/stripe:
    post:
      summary: Stripe webhook for paid Fish Credits
      description: Verifies the Stripe signature and grants prepaid Fish Credits for paid `checkout.session.completed` events. The raw body must be signed by Stripe.
      responses:
        '200':
          description: Webhook processed or ignored
        '400':
          description: Invalid Stripe signature or event metadata
        '503':
          description: Stripe webhook secret is not configured
  /api/billing/checkout/usdc:
    post:
      summary: Create a Base USDC payment request for Fish Credits
      description: Fish API-key route that returns a Base USDC amount, token, chain, recipient address, and payment id. Credits are not issued until `/confirm` verifies the transfer onchain.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FishUsdcCheckoutRequest'
      responses:
        '200':
          description: USDC payment request created
          content:
            application/json:
              schema:
                type: object
                properties:
                  object:
                    type: string
                    example: fish_usdc_payment
                  idempotent:
                    type: boolean
                  payment:
                    $ref: '#/components/schemas/FishPaymentRequest'
        '400':
          description: Invalid USDC checkout request
        '401':
          description: Fish API key required
        '503':
          description: USDC checkout is not configured
  /api/billing/checkout/usdc/confirm:
    post:
      summary: Confirm a Base USDC payment for Fish Credits
      description: Verifies the transaction receipt through the configured RPC, checks ERC-20 transfer logs, and grants prepaid credits only after the expected recipient and amount are found.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FishUsdcConfirmationRequest'
      responses:
        '200':
          description: USDC payment confirmed and credits issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  object:
                    type: string
                    example: fish_usdc_payment_confirmation
                  idempotent:
                    type: boolean
                  payment:
                    $ref: '#/components/schemas/FishPaymentRequest'
        '400':
          description: Invalid confirmation request or no matching USDC transfer
        '401':
          description: Fish API key required
        '403':
          description: Payment belongs to another Fish account
        '409':
          description: Transaction needs more confirmations
        '410':
          description: Payment request expired
        '503':
          description: USDC RPC is not configured
  /api/billing/usage-analytics:
    get:
      summary: Aggregate Fish billing usage analytics
      description: Public-safe aggregate billing metrics. Excludes API keys, raw prompts, outputs, and account-level rows.
      responses:
        '200':
          description: Billing usage analytics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingUsageAnalytics'
  /api/providers/pilot:
    get:
      summary: Public-safe provider pilot registry and selected allowlist
      parameters:
        - in: query
          name: providerId
          schema:
            type: string
          description: Optional provider id to check against the allowlist.
        - in: query
          name: workloadType
          schema:
            type: string
            default: chat_batch
        - in: query
          name: model
          schema:
            type: string
            default: fish-demo-chat
      responses:
        '200':
          description: Provider pilot registry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderPilotRegistry'
  /api/providers/pilot/export:
    get:
      summary: Admin-only provider pilot outreach export
      security:
        - adminToken: []
      responses:
        '200':
          description: Provider pilot operator export with private outreach fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderPilotOperatorExport'
  /api/submissions/export:
    get:
      summary: Admin-only waitlist and provider signup export
      security:
        - adminToken: []
      parameters:
        - in: query
          name: kind
          schema:
            type: string
            enum: [all, waitlist, provider]
            default: all
        - in: query
          name: format
          schema:
            type: string
            enum: [json, csv]
            default: json
      responses:
        '200':
          description: Signup export
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionExport'
            text/csv:
              schema:
                type: string
        '401':
          description: Admin token required
  /api/providers/jobs:
    post:
      summary: Run a selected-provider prototype batch job
      description: Admin-only controlled adapter. Checks provider allowlist, never stores prompt/output text, and writes a public-safe signed provider job receipt. Mock adapter modes are marked sample and do not auto-accrue payout events.
      security:
        - adminToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [providerId, inputRef]
              properties:
                providerId:
                  type: string
                workloadType:
                  type: string
                  default: chat_batch
                model:
                  type: string
                  default: fish-demo-chat
                inputRef:
                  type: string
                  description: Hash or reference for the job input. Raw prompt text must not be submitted.
                parameters:
                  type: object
                  properties:
                    maxOutputTokens:
                      type: integer
                    temperature:
                      type: number
                maxRuntimeSeconds:
                  type: integer
                maxCostUsd:
                  type: number
                adapterMode:
                  type: string
                  enum: [mock_success, mock_failure, mock_timeout, provider_http]
      responses:
        '200':
          description: Provider job completed
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  receipt:
                    $ref: '#/components/schemas/ProviderJobReceipt'
                  payoutEvent:
                    nullable: true
                    allOf:
                      - $ref: '#/components/schemas/OperatorPayoutEvent'
  /api/providers/smoke:
    post:
      summary: Run a deterministic selected-provider smoke job
      description: Admin-only shortcut for provider onboarding. It builds a hash-only smoke input, checks the selected-provider allowlist, uses provider_http when a private provider endpoint is configured, and writes the same public-safe provider job receipt as /api/providers/jobs.
      security:
        - adminToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProviderSmokeRequest'
      responses:
        '200':
          description: Provider smoke job completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderSmokeResponse'
        '400':
          description: Invalid smoke request
        '401':
          description: Admin token required
        '403':
          description: Provider is not selected for this workload or model
        '502':
          description: Provider smoke job failed or timed out
  /api/proof/summary:
    get:
      summary: Public proof dashboard summary
      responses:
        '200':
          description: Public proof summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProofSummary'
  /api/proof/receipts:
    get:
      summary: Filterable public-safe provider job receipt ledger
      parameters:
        - in: query
          name: provider
          schema:
            type: string
          description: Provider id or public label substring.
        - in: query
          name: providerId
          schema:
            type: string
        - in: query
          name: status
          schema:
            type: string
            enum: [succeeded, failed, timed_out, not_allowed]
        - in: query
          name: backend
          schema:
            type: string
            enum: [ocean_provider]
        - in: query
          name: receiptType
          schema:
            type: string
            enum: [provider_job_receipt]
        - in: query
          name: signatureStatus
          schema:
            type: string
            enum: [not_required, valid, invalid, missing]
        - in: query
          name: from
          schema:
            type: string
          description: Inclusive createdAt lower bound.
        - in: query
          name: to
          schema:
            type: string
          description: Inclusive createdAt upper bound.
        - in: query
          name: limit
          schema:
            type: integer
            default: 100
            minimum: 1
            maximum: 500
      responses:
        '200':
          description: Receipt list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceiptLedgerResponse'
  /api/proof/receipts/{receiptId}:
    get:
      summary: Public-safe provider job receipt detail
      parameters:
        - in: path
          name: receiptId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Receipt detail without prompt or output text
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicReceiptDetail'
        '404':
          description: Receipt not found
  /api/proof/receipts/export:
    get:
      summary: Admin-only provider receipt ledger export
      security:
        - adminToken: []
      parameters:
        - in: query
          name: format
          schema:
            type: string
            enum: [csv, json]
            default: csv
        - in: query
          name: provider
          schema:
            type: string
        - in: query
          name: status
          schema:
            type: string
            enum: [succeeded, failed, timed_out, not_allowed]
        - in: query
          name: limit
          schema:
            type: integer
            default: 100
            minimum: 1
            maximum: 500
      responses:
        '200':
          description: CSV or JSON receipt ledger export for operator review
          content:
            text/csv:
              schema:
                type: string
            application/json:
              schema:
                type: object
        '401':
          description: Admin token required
  /api/proof/providers:
    get:
      summary: Public-safe provider scorecard
      responses:
        '200':
          description: Provider scorecard summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderScorecardSummary'
  /api/proof/benchmarks:
    get:
      summary: Public-safe provider benchmark matrix
      parameters:
        - in: query
          name: selectedOnly
          schema:
            type: boolean
            default: true
          description: When true, show only currently selected provider rows.
        - in: query
          name: provider
          schema:
            type: string
          description: Provider id or public label substring.
        - in: query
          name: providerId
          schema:
            type: string
        - in: query
          name: benchmarkId
          schema:
            type: string
            enum: [tiny_smoke, small_chat, summary_batch]
        - in: query
          name: status
          schema:
            type: string
            enum: [succeeded, failed, timed_out, not_allowed, untested]
        - in: query
          name: limit
          schema:
            type: integer
            default: 100
            minimum: 1
            maximum: 500
      responses:
        '200':
          description: Provider benchmark matrix
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BenchmarkSummary'
    post:
      summary: Admin-only selected-provider benchmark run
      description: Runs one fixed benchmark definition through the provider-job proof adapter. The request accepts provider id, benchmark id, and prototype adapter mode only; prompt and output text are never accepted or stored.
      security:
        - adminToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [providerId]
              properties:
                providerId:
                  type: string
                benchmarkId:
                  type: string
                  enum: [tiny_smoke, small_chat, summary_batch]
                adapterMode:
                  type: string
                  enum: [mock_success, mock_failure, mock_timeout, provider_http]
      responses:
        '200':
          description: Benchmark run completed
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  run:
                    $ref: '#/components/schemas/BenchmarkRun'
                  receipt:
                    $ref: '#/components/schemas/ProviderJobReceipt'
        '400':
          description: Invalid benchmark request
        '401':
          description: Admin token required
        '403':
          description: Provider is not selected for the benchmark workload
  /api/proof/market-making:
    get:
      summary: Public-safe market-making routing and cost report
      responses:
        '200':
          description: Market-making report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketMakingSummary'
  /api/proof/provider-bonds:
    get:
      summary: Public-safe provider OCEAN bond summary
      parameters:
        - in: query
          name: provider
          schema:
            type: string
          description: Provider id or public label substring.
        - in: query
          name: providerId
          schema:
            type: string
        - in: query
          name: state
          schema:
            $ref: '#/components/schemas/ProviderBondState'
        - in: query
          name: activeOnly
          schema:
            type: boolean
            default: false
        - in: query
          name: limit
          schema:
            type: integer
            default: 100
            minimum: 1
            maximum: 500
      responses:
        '200':
          description: Public-safe offchain provider bond summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderBondSummary'
    post:
      summary: Admin-only offchain provider OCEAN bond record
      description: Creates or updates an offchain prototype bond record. Raw wallet references are hashed before storage.
      security:
        - adminToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProviderBondRequest'
      responses:
        '201':
          description: Bond record created
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  created:
                    type: boolean
                  position:
                    $ref: '#/components/schemas/OperatorProviderBondPosition'
        '200':
          description: Bond record updated
        '400':
          description: Invalid bond request
        '401':
          description: Admin token required
        '403':
          description: Provider is not eligible to bond
        '404':
          description: Provider not found
  /api/proof/payouts:
    get:
      summary: Public-safe provider payout accounting summary
      parameters:
        - in: query
          name: provider
          schema:
            type: string
          description: Provider id or public label substring.
        - in: query
          name: providerId
          schema:
            type: string
        - in: query
          name: state
          schema:
            type: string
            enum: [accrued, review, approved, paid, disputed, voided]
        - in: query
          name: eventType
          schema:
            type: string
            enum: [job_accrued, benchmark_stipend, manual_adjustment, refund, payout_approved, payout_paid, payout_voided]
        - in: query
          name: sourceReceiptId
          schema:
            type: string
        - in: query
          name: from
          schema:
            type: string
          description: Inclusive createdAt lower bound.
        - in: query
          name: to
          schema:
            type: string
          description: Inclusive createdAt upper bound.
        - in: query
          name: limit
          schema:
            type: integer
            default: 100
            minimum: 1
            maximum: 500
      responses:
        '200':
          description: Provider payout summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayoutSummary'
    post:
      summary: Admin-only manual provider payout event
      security:
        - adminToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [providerId, amountUsd, reason]
              properties:
                providerId:
                  type: string
                providerLabel:
                  type: string
                sourceReceiptId:
                  type: string
                  nullable: true
                sourceReceiptHash:
                  type: string
                  nullable: true
                sourceSignatureStatus:
                  type: string
                  enum: [not_required, valid, invalid, missing]
                  nullable: true
                eventType:
                  type: string
                  enum: [job_accrued, benchmark_stipend, manual_adjustment, refund, payout_approved, payout_paid, payout_voided]
                amount:
                  type: number
                currency:
                  type: string
                amountUsd:
                  type: number
                state:
                  type: string
                  enum: [accrued, review, approved, paid, disputed, voided]
                operatorOwner:
                  type: string
                reason:
                  type: string
                transactionRef:
                  type: string
                  nullable: true
      responses:
        '201':
          description: Payout event created
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  event:
                    $ref: '#/components/schemas/OperatorPayoutEvent'
  /api/proof/payouts/batches:
    get:
      summary: Admin-only payout batch list
      security:
        - adminToken: []
      responses:
        '200':
          description: Payout batch list
          content:
            application/json:
              schema:
                type: object
                properties:
                  object:
                    type: string
                    example: list
                  dataState:
                    type: string
                    enum: [live, snapshot, sample, unavailable]
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PayoutBatch'
    post:
      summary: Admin-only payout review batch creation
      security:
        - adminToken: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                eventIds:
                  type: array
                  items:
                    type: string
                states:
                  type: array
                  items:
                    type: string
                    enum: [accrued, review, approved, paid, disputed, voided]
                operatorOwner:
                  type: string
                reason:
                  type: string
      responses:
        '201':
          description: Payout batch created
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  batch:
                    $ref: '#/components/schemas/PayoutBatch'
  /api/proof/payouts/batches/{batchId}/export:
    get:
      summary: Admin-only payout batch CSV export
      security:
        - adminToken: []
      parameters:
        - in: path
          name: batchId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: CSV export for one payout batch and its payable events
          content:
            text/csv:
              schema:
                type: string
        '401':
          description: Admin token required
        '404':
          description: Payout batch not found
  /api/proof/payouts/export:
    get:
      summary: Admin-only provider payout CSV export
      security:
        - adminToken: []
      parameters:
        - in: query
          name: provider
          schema:
            type: string
        - in: query
          name: providerId
          schema:
            type: string
        - in: query
          name: state
          schema:
            type: string
            enum: [accrued, review, approved, paid, disputed, voided]
        - in: query
          name: eventType
          schema:
            type: string
            enum: [job_accrued, benchmark_stipend, manual_adjustment, refund, payout_approved, payout_paid, payout_voided]
        - in: query
          name: limit
          schema:
            type: integer
            default: 100
            minimum: 1
            maximum: 500
      responses:
        '200':
          description: CSV payout event export
          content:
            text/csv:
              schema:
                type: string
  /api/ocean/refresh:
    post:
      summary: Trigger a refresh of Ocean Network supply snapshots
      responses:
        '200':
          description: Refresh result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OceanSummary'
  /api/usage/summary:
    get:
      summary: Fish usage proof summary
      responses:
        '200':
          description: Usage summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  dataState:
                    type: string
                    enum: [live, snapshot, sample, unavailable]
                  requests:
                    type: integer
                  oceanNativeJobs:
                    type: integer
                  providerPayoutUsd:
                    type: number
                  creditsSpent:
                    type: number
                  creditsRemaining:
                    type: number
                  userChargeUsd:
                    type: number
                  providerCostUsd:
                    type: number
                  grossMarginUsd:
                    type: number
                  lastReceiptAt:
                    type: string
                    nullable: true
                  message:
                    type: string
  /api/staking/summary:
    get:
      summary: Public offchain OCEAN staking credit summary
      responses:
        '200':
          description: Staking credit summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StakingCreditSummary'
  /api/staking/positions:
    get:
      summary: Public offchain OCEAN staking positions
      responses:
        '200':
          description: Public staking positions
          content:
            application/json:
              schema:
                type: object
                properties:
                  object:
                    type: string
                    example: list
                  dataState:
                    type: string
                    enum: [live, snapshot, sample, unavailable]
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PublicStakingPosition'
    post:
      summary: Admin-only offchain OCEAN stake record and Fish Credit issuance
      security:
        - adminToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [walletRef, oceanAmount]
              properties:
                holderLabel:
                  type: string
                walletRef:
                  type: string
                oceanAmount:
                  type: number
                lockDays:
                  type: integer
                budgetId:
                  type: string
                issueApiKey:
                  type: boolean
      responses:
        '201':
          description: Staking position recorded and credits issued when budget allows
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  position:
                    $ref: '#/components/schemas/PublicStakingPosition'
                  apiKey:
                    type: string
                    nullable: true
                  keyNotice:
                    type: string
                    nullable: true
        '401':
          description: Admin token required
  /api/staking/wallet-intents:
    get:
      summary: Public-safe signed OCEAN wallet intent list
      description: Lists wallet lock intents with hashed addresses and signatures only. These intents do not issue credits until a lock contract or operator verification flow confirms them.
      responses:
        '200':
          description: Public wallet intent summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletIntentSummary'
    post:
      summary: Record a signed OCEAN lock intent
      description: Browser-wallet prototype for holders to sign OCEAN lock intent. The route stores public-safe hashes and estimated credits, but does not stake tokens or issue Fish Credits.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WalletIntentRequest'
      responses:
        '201':
          description: Wallet intent recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  intent:
                    $ref: '#/components/schemas/PublicWalletIntent'
                  notice:
                    type: string
        '400':
          description: Invalid signed wallet intent
  /api/waitlist:
    post:
      summary: Submit user/developer waitlist interest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WaitlistRequest'
      responses:
        '200':
          description: Submission accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  id:
                    type: string
  /api/providers/apply:
    post:
      summary: Submit provider pilot application
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProviderApplication'
      responses:
        '200':
          description: Application accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  id:
                    type: string
  /v1/api_keys:
    get:
      summary: Show the current Fish API key metadata
      description: Returns public metadata for the bearer key without exposing the key hash or any other account rows.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current key metadata
          content:
            application/json:
              schema:
                type: object
                properties:
                  object:
                    type: string
                    example: list
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        label:
                          type: string
                        createdAt:
                          type: string
                        rotatedAt:
                          type: string
                          nullable: true
                        lastUsedAt:
                          type: string
                          nullable: true
                        status:
                          type: string
                          enum: [active, revoked]
                        revokedAt:
                          type: string
                          nullable: true
                        planId:
                          type: string
                          enum: [free, pro, team-api, provider-test]
                        planActivatedAt:
                          type: string
                          nullable: true
                        planExpiresAt:
                          type: string
                          nullable: true
                        planSource:
                          type: string
                          nullable: true
                          enum: [pilot_key, operator_subscription]
                        creditBalance:
                          type: integer
                        requestCount:
                          type: integer
        '401':
          description: Fish API key required
    post:
      summary: Create a prototype Fish API key
      description: Requires an admin token in production. The returned key is shown once and stored only as a hash.
      security:
        - adminToken: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                label:
                  type: string
                creditGrant:
                  type: integer
                  minimum: 1
                  maximum: 100000
                planId:
                  type: string
                  enum: [free, pro, team-api, provider-test]
                  default: free
      responses:
        '200':
          description: Prototype key created
          content:
            application/json:
              schema:
                type: object
                properties:
                  object:
                    type: string
                    example: api_key
                  key:
                    type: string
                  keyNotice:
                    type: string
                  account:
                    $ref: '#/components/schemas/FishAccount'
  /v1/api_keys/current:
    patch:
      summary: Rename or rotate the current Fish API key
      description: Updates the bearer key label and optionally rotates the secret. A rotated key is returned once, stored only as a hash, and the previous key stops authenticating.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                label:
                  type: string
                  minLength: 1
                  maxLength: 80
                rotate:
                  type: boolean
                  default: false
      responses:
        '200':
          description: Current key updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  object:
                    type: string
                    example: api_key
                  rotated:
                    type: boolean
                  key:
                    type: string
                    nullable: true
                  keyNotice:
                    type: string
                    nullable: true
                  account:
                    $ref: '#/components/schemas/FishAccount'
        '400':
          description: Invalid key update
        '401':
          description: Fish API key required
    delete:
      summary: Revoke the current Fish API key
      description: Marks the bearer key as revoked. Existing balances and receipts remain available in storage, but the key can no longer authenticate future requests.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current key revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  object:
                    type: string
                    example: api_key
                  revoked:
                    type: boolean
                  alreadyRevoked:
                    type: boolean
                  account:
                    $ref: '#/components/schemas/FishAccount'
        '401':
          description: Fish API key required or already revoked
  /v1/models:
    get:
      summary: List prototype Fish models and dish aliases
      responses:
        '200':
          description: Model list
          content:
            application/json:
              schema:
                type: object
                properties:
                  object:
                    type: string
                    example: list
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/FishModel'
  /v1/chat/completions:
    post:
      summary: Create a prototype chat completion
      description: OpenAI-style route that requires a Fish API key, debits credits, writes a usage receipt, and can optionally call a configured external compatible backend. Dish model aliases such as `fish-ask`, `fish-code`, `fish-docs`, `fish-repo`, `fish-eval`, `fish-data`, and `fish-ocean-helper` apply the matching Fish feature policy without requiring metadata.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FishChatRequest'
      responses:
        '200':
          description: Chat completion. When `stream` is true, the same settled completion is returned as OpenAI-style server-sent events.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FishChatCompletion'
            text/event-stream:
              schema:
                type: string
        '400':
          description: Invalid request or unknown Fish model
        '401':
          description: Fish API key required
        '402':
          description: Insufficient Fish credits
        '403':
          description: Model or external fallback is not allowed for this plan
        '429':
          description: Monthly request limit, minute rate limit, daily quota, or route budget exceeded
        '503':
          description: Selected route is unavailable
  /v1/balance:
    get:
      summary: Get prototype account balance
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Balance
          content:
            application/json:
              schema:
                type: object
                properties:
                  object:
                    type: string
                    example: balance
                  account:
                    $ref: '#/components/schemas/FishAccount'
                  creditLanes:
                    type: array
                    items:
                      $ref: '#/components/schemas/FishCreditLane'
                  monthlyRequests:
                    $ref: '#/components/schemas/FishMonthlyRequestState'
                  totals:
                    $ref: '#/components/schemas/FishUsageTotals'
  /v1/usage:
    get:
      summary: List recent prototype usage receipts
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Usage receipts
          content:
            application/json:
              schema:
                type: object
                properties:
                  object:
                    type: string
                    example: list
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/FishUsageReceipt'
                  creditLanes:
                    type: array
                    items:
                      $ref: '#/components/schemas/FishCreditLane'
                  monthlyRequests:
                    $ref: '#/components/schemas/FishMonthlyRequestState'
                  totals:
                    $ref: '#/components/schemas/FishUsageTotals'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    adminToken:
      type: apiKey
      in: header
      name: x-fish-admin-token
  schemas:
    OceanSummary:
      type: object
      required: [dataState, lastUpdated, kpis]
      properties:
        dataState:
          type: string
          enum: [live, snapshot, sample, unavailable]
        lastUpdated:
          type: string
        sources:
          type: array
          items:
            type: object
        sourceCount:
          type: integer
        warnings:
          type: array
          items:
            type: string
        kpis:
          type: object
          properties:
            totalGpus:
              type: number
            availableGpus:
              type: number
            providerCount:
              type: integer
            eligibleNodeCount:
              type: integer
            fishReadyProviderCount:
              type: integer
            h200FromUsdHr:
              type: number
              nullable: true
            lowestListedGpuFee:
              type: number
              nullable: true
            oceanNativeJobs:
              type: integer
            benchmarkJobs:
              type: integer
            providerPayoutUsd:
              type: number
              nullable: true
            networkRevenueUsd:
              type: number
              nullable: true
        gpuSupply:
          type: array
          items:
            $ref: '#/components/schemas/GpuSupplyRow'
        providers:
          type: array
          items:
            $ref: '#/components/schemas/ProviderScore'
    GpuSupplyRow:
      type: object
      properties:
        gpu:
          type: string
        total:
          type: number
        available:
          type: number
        providers:
          type: integer
        lowestUsdHr:
          type: number
          nullable: true
        medianUsdHr:
          type: number
          nullable: true
        lowestListedPrice:
          type: number
          nullable: true
        regions:
          type: array
          items:
            type: string
    ComputeResource:
      type: object
      properties:
        timestamp:
          type: string
        source:
          type: string
        providerId:
          type: string
        providerLabel:
          type: string
        nodeEndpoint:
          type: string
        environmentId:
          type: string
        region:
          type: string
        resourceType:
          type: string
        resourceName:
          type: string
        total:
          type: number
        inUse:
          type: number
        available:
          type: number
        feeToken:
          type: string
        pricePerMinute:
          type: number
          nullable: true
        pricePerHour:
          type: number
          nullable: true
        listedPrice:
          type: number
          nullable: true
        priceBasis:
          type: string
        status:
          type: string
    ProviderScore:
      type: object
      properties:
        providerId:
          type: string
        label:
          type: string
        region:
          type: string
        gpuTypes:
          type: array
          items:
            type: string
        availableGpus:
          type: number
        lowestUsdHr:
          type: number
          nullable: true
        lowestListedPrice:
          type: number
          nullable: true
        uptime7d:
          type: number
          nullable: true
        benchmarkStatus:
          type: string
        pilotEligible:
          type: boolean
        nodeStatus:
          type: string
          enum: [eligible, not_eligible, unknown]
        fishReadyStatus:
          type: string
          enum: [ready, selected, candidate, needs_review]
        nodeHttp:
          type: boolean
          nullable: true
        nodeP2p:
          type: boolean
          nullable: true
        nodeVersion:
          type: string
          nullable: true
        lastSeen:
          type: string
          nullable: true
        readinessLabel:
          type: string
          nullable: true
        verified:
          type: boolean
    OceanBatchJobRequest:
      type: object
      additionalProperties: false
      required: [inputRef]
      properties:
        taskType:
          type: string
          enum: [document_summary, structured_extraction, embeddings, batch_chat]
          default: document_summary
        inputRef:
          type: string
          description: Hash or storage reference for the batch input. Raw document text must not be submitted.
        estimatedInputTokens:
          type: integer
          minimum: 1
          maximum: 200000
        maxOutputTokens:
          type: integer
          minimum: 1
          maximum: 8192
          default: 512
        maxRuntimeSeconds:
          type: integer
          minimum: 1
          maximum: 3600
          default: 600
        maxCostUsd:
          type: number
          minimum: 0
          maximum: 100
          default: 1
        adapterMode:
          type: string
          enum: [sample_success, sample_failure, ocean_http]
          default: sample_success
    ProviderSmokeRequest:
      type: object
      additionalProperties: false
      required: [providerId]
      properties:
        providerId:
          type: string
        workloadType:
          type: string
          default: chat_batch
        model:
          type: string
          default: fish-demo-chat
        adapterMode:
          type: string
          enum: [mock_success, mock_failure, mock_timeout, provider_http]
          description: Optional. Defaults to provider_http when a private endpoint is configured, otherwise mock_success sample mode.
        maxRuntimeSeconds:
          type: integer
          minimum: 1
          maximum: 120
          default: 30
        maxCostUsd:
          type: number
          minimum: 0
          maximum: 5
          default: 0.25
        parameters:
          type: object
          properties:
            maxOutputTokens:
              type: integer
              minimum: 1
              maximum: 1024
              default: 64
            temperature:
              type: number
              minimum: 0
              maximum: 2
              default: 0.1
    ProviderSmokeResponse:
      type: object
      properties:
        ok:
          type: boolean
        error:
          type: string
        smoke:
          type: object
          properties:
            inputRef:
              type: string
            adapterMode:
              type: string
              enum: [mock_success, mock_failure, mock_timeout, provider_http]
            storesPromptOutputText:
              type: boolean
              enum: [false]
        receipt:
          $ref: '#/components/schemas/ProviderJobReceipt'
        payoutEvent:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/OperatorPayoutEvent'
    OceanBatchSummary:
      type: object
      properties:
        dataState:
          type: string
          enum: [live, snapshot, sample, unavailable]
        lastUpdated:
          type: string
        jobs:
          type: integer
        succeededJobs:
          type: integer
        failedJobs:
          type: integer
        timedOutJobs:
          type: integer
        tokensProcessed:
          type: integer
        providerCostUsd:
          type: number
        budget:
          $ref: '#/components/schemas/OceanBatchBudgetState'
        storesPromptOutputText:
          type: boolean
          enum: [false]
        receipts:
          type: array
          items:
            $ref: '#/components/schemas/OceanBatchReceipt'
        warnings:
          type: array
          items:
            type: string
    OceanBatchBudgetState:
      type: object
      properties:
        dailyBudgetUsd:
          type: number
        spentUsd:
          type: number
        estimatedCostUsd:
          type: number
        remainingUsd:
          type: number
    OceanProofReadiness:
      type: object
      properties:
        dataState:
          type: string
          enum: [live, snapshot, sample, unavailable]
        generatedAt:
          type: string
        trafficReady:
          type: boolean
        proofReady:
          type: boolean
        route:
          type: object
          properties:
            batchEndpointConfigured:
              type: boolean
            batchApiKeyConfigured:
              type: boolean
            providerIdConfigured:
              type: boolean
            dailyBudgetUsd:
              type: number
        adapter:
          type: object
          properties:
            configured:
              type: boolean
            reachable:
              type: boolean
            healthState:
              type: string
              enum: [ok, error, not_configured]
            mode:
              type: string
              nullable: true
            liveReady:
              type: boolean
            configuredForFreeCompute:
              type: boolean
              nullable: true
            selected:
              type: object
              properties:
                nodeUrlConfigured:
                  type: boolean
                computeEnvIdConfigured:
                  type: boolean
                datasetDidsConfigured:
                  type: boolean
                algoDidConfigured:
                  type: boolean
                paymentTokenConfigured:
                  type: boolean
                resourcesConfigured:
                  type: boolean
                outputConfigured:
                  type: boolean
            missing:
              type: array
              items:
                type: string
            warnings:
              type: array
              items:
                type: string
        proof:
          type: object
          properties:
            hasNonSampleReceipt:
              type: boolean
            nonSampleJobs:
              type: integer
            latestReceiptState:
              type: string
              enum: [live, snapshot, sample, unavailable]
            latestReceiptAt:
              type: string
              nullable: true
            succeededJobs:
              type: integer
        blockers:
          type: array
          items:
            type: string
    OceanBatchReceipt:
