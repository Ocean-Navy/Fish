openapi: 3.0.3
info:
  title: Fish Landing + Dashboard API
  version: 0.1.0
  description: API contract for the Fish landing page, Ocean Network supply dashboard, provider pilot, and waitlist.
servers:
  - url: http://127.0.0.1:3000
paths:
  /api/health:
    get:
      summary: Health check
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  service:
                    type: string
                  timestamp:
                    type: string
  /api/ocean/summary:
    get:
      summary: Aggregate Ocean Network compute supply and usage summary
      responses:
        '200':
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OceanSummary'
  /api/ocean/resources:
    get:
      summary: Normalized compute resources
      responses:
        '200':
          description: Resource list
          content:
            application/json:
              schema:
                type: object
                properties:
                  dataState:
                    type: string
                    enum: [live, snapshot, sample, unavailable]
                  lastUpdated:
                    type: string
                  resources:
                    type: array
                    items:
                      $ref: '#/components/schemas/ComputeResource'
  /api/ocean/providers:
    get:
      summary: Provider scorecard
      responses:
        '200':
          description: Provider list
          content:
            application/json:
              schema:
                type: object
                properties:
                  dataState:
                    type: string
                    enum: [live, snapshot, sample, unavailable]
                  lastUpdated:
                    type: string
                  providers:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProviderScore'
  /api/ocean/batch/jobs:
    get:
      summary: Public-safe Ocean batch job summary
      description: Lists recent Ocean batch receipts without prompt text, output text, endpoint URLs, API keys, or private provider contact data.
      responses:
        '200':
          description: Ocean batch summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OceanBatchSummary'
    post:
      summary: Submit a capped Ocean batch job
      description: Fish API-key route for Docs-style batch jobs. The request accepts input references only; raw document text and full output text are not accepted or stored by this contract.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OceanBatchJobRequest'
      responses:
        '200':
          description: Ocean batch job completed
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  receipt:
                    $ref: '#/components/schemas/OceanBatchReceipt'
                  usageReceipt:
                    $ref: '#/components/schemas/FishUsageReceipt'
                  creditsRemaining:
                    type: integer
                  budget:
                    $ref: '#/components/schemas/OceanBatchBudgetState'
                  quota:
                    $ref: '#/components/schemas/FishQuotaState'
        '401':
          description: Fish API key required
        '402':
          description: Insufficient Fish Credits
        '429':
          description: Ocean batch daily budget or daily quota exceeded
        '502':
          description: Ocean batch backend failed
        '504':
          description: Ocean batch backend timed out
  /api/routing/policy:
    get:
      summary: Public Fish routing policy
      description: Public-safe route compass for mock chat, external fallback, selected Ocean providers, future privacy stages, and receipt rules. It does not expose secrets.
      responses:
        '200':
          description: Route policy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FishRoutePolicy'
  /api/warm/status:
    get:
      summary: Public-safe warm inference status
      description: Shows whether the configured warm demo route is ready without exposing endpoint URLs, API keys, prompts, or outputs.
      responses:
        '200':
          description: Warm route status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WarmInferenceStatus'
  /api/meal/order:
    post:
      summary: Guest Fish meal-counter order
      description: Capped guest route for the public meal counter. Uses the same chat request shape without exposing a Fish API key.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FishChatRequest'
      responses:
        '200':
          description: Meal order completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FishChatCompletion'
  /api/billing/plans:
    get:
      summary: Public Fish plan catalog
      description: Prototype/future plan metadata with limits and routing permissions. This does not enable checkout.
      responses:
        '200':
          description: Plan catalog
          content:
            application/json:
              schema:
                type: object
                properties:
                  object:
                    type: string
                    example: list
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/FishPlan'
  /api/billing/usage-analytics:
    get:
      summary: Aggregate Fish billing usage analytics
      description: Public-safe aggregate billing metrics. Excludes API keys, raw prompts, outputs, and account-level rows.
      responses:
        '200':
          description: Billing usage analytics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingUsageAnalytics'
  /api/providers/pilot:
    get:
      summary: Public-safe provider pilot registry and selected allowlist
      parameters:
        - in: query
          name: providerId
          schema:
            type: string
          description: Optional provider id to check against the allowlist.
        - in: query
          name: workloadType
          schema:
            type: string
            default: chat_batch
        - in: query
          name: model
          schema:
            type: string
            default: fish-demo-chat
      responses:
        '200':
          description: Provider pilot registry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderPilotRegistry'
  /api/providers/pilot/export:
    get:
      summary: Admin-only provider pilot outreach export
      security:
        - adminToken: []
      responses:
        '200':
          description: Provider pilot operator export with private outreach fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderPilotOperatorExport'
  /api/submissions/export:
    get:
      summary: Admin-only waitlist and provider signup export
      security:
        - adminToken: []
      parameters:
        - in: query
          name: kind
          schema:
            type: string
            enum: [all, waitlist, provider]
            default: all
        - in: query
          name: format
          schema:
            type: string
            enum: [json, csv]
            default: json
      responses:
        '200':
          description: Signup export
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionExport'
            text/csv:
              schema:
                type: string
        '401':
          description: Admin token required
  /api/providers/jobs:
    post:
      summary: Run a selected-provider prototype batch job
      description: Admin-only controlled adapter. Checks provider allowlist, never stores prompt/output text, and writes a public-safe signed provider job receipt. Mock adapter modes are marked sample and do not auto-accrue payout events.
      security:
        - adminToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [providerId, inputRef]
              properties:
                providerId:
                  type: string
                workloadType:
                  type: string
                  default: chat_batch
                model:
                  type: string
                  default: fish-demo-chat
                inputRef:
                  type: string
                  description: Hash or reference for the job input. Raw prompt text must not be submitted.
                parameters:
                  type: object
                  properties:
                    maxOutputTokens:
                      type: integer
                    temperature:
                      type: number
                maxRuntimeSeconds:
                  type: integer
                maxCostUsd:
                  type: number
                adapterMode:
                  type: string
                  enum: [mock_success, mock_failure, mock_timeout, provider_http]
      responses:
        '200':
          description: Provider job completed
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  receipt:
                    $ref: '#/components/schemas/ProviderJobReceipt'
                  payoutEvent:
                    nullable: true
                    allOf:
                      - $ref: '#/components/schemas/OperatorPayoutEvent'
  /api/providers/smoke:
    post:
      summary: Run a deterministic selected-provider smoke job
      description: Admin-only shortcut for provider onboarding. It builds a hash-only smoke input, checks the selected-provider allowlist, uses provider_http when a private provider endpoint is configured, and writes the same public-safe provider job receipt as /api/providers/jobs.
      security:
        - adminToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProviderSmokeRequest'
      responses:
        '200':
          description: Provider smoke job completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderSmokeResponse'
        '400':
          description: Invalid smoke request
        '401':
          description: Admin token required
        '403':
          description: Provider is not selected for this workload or model
        '502':
          description: Provider smoke job failed or timed out
  /api/proof/summary:
    get:
      summary: Public proof dashboard summary
      responses:
        '200':
          description: Public proof summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProofSummary'
  /api/proof/receipts:
    get:
      summary: Filterable public-safe provider job receipt ledger
      parameters:
        - in: query
          name: provider
          schema:
            type: string
          description: Provider id or public label substring.
        - in: query
          name: providerId
          schema:
            type: string
        - in: query
          name: status
          schema:
            type: string
            enum: [succeeded, failed, timed_out, not_allowed]
        - in: query
          name: backend
          schema:
            type: string
            enum: [ocean_provider]
        - in: query
          name: receiptType
          schema:
            type: string
            enum: [provider_job_receipt]
        - in: query
          name: signatureStatus
          schema:
            type: string
            enum: [not_required, valid, invalid, missing]
        - in: query
          name: from
          schema:
            type: string
          description: Inclusive createdAt lower bound.
        - in: query
          name: to
          schema:
            type: string
          description: Inclusive createdAt upper bound.
        - in: query
          name: limit
          schema:
            type: integer
            default: 100
            minimum: 1
            maximum: 500
      responses:
        '200':
          description: Receipt list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceiptLedgerResponse'
  /api/proof/receipts/{receiptId}:
    get:
      summary: Public-safe provider job receipt detail
      parameters:
        - in: path
          name: receiptId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Receipt detail without prompt or output text
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicReceiptDetail'
        '404':
          description: Receipt not found
  /api/proof/receipts/export:
    get:
      summary: Admin-only provider receipt ledger export
      security:
        - adminToken: []
      parameters:
        - in: query
          name: format
          schema:
            type: string
            enum: [csv, json]
            default: csv
        - in: query
          name: provider
          schema:
            type: string
        - in: query
          name: status
          schema:
            type: string
            enum: [succeeded, failed, timed_out, not_allowed]
        - in: query
          name: limit
          schema:
            type: integer
            default: 100
            minimum: 1
            maximum: 500
      responses:
        '200':
          description: CSV or JSON receipt ledger export for operator review
          content:
            text/csv:
              schema:
                type: string
            application/json:
              schema:
                type: object
        '401':
          description: Admin token required
  /api/proof/providers:
    get:
      summary: Public-safe provider scorecard
      responses:
        '200':
          description: Provider scorecard summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderScorecardSummary'
  /api/proof/benchmarks:
    get:
      summary: Public-safe provider benchmark matrix
      parameters:
        - in: query
          name: selectedOnly
          schema:
            type: boolean
            default: true
          description: When true, show only currently selected provider rows.
        - in: query
          name: provider
          schema:
            type: string
          description: Provider id or public label substring.
        - in: query
          name: providerId
          schema:
            type: string
        - in: query
          name: benchmarkId
          schema:
            type: string
            enum: [tiny_smoke, small_chat, summary_batch]
        - in: query
          name: status
          schema:
            type: string
            enum: [succeeded, failed, timed_out, not_allowed, untested]
        - in: query
          name: limit
          schema:
            type: integer
            default: 100
            minimum: 1
            maximum: 500
      responses:
        '200':
          description: Provider benchmark matrix
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BenchmarkSummary'
    post:
      summary: Admin-only selected-provider benchmark run
      description: Runs one fixed benchmark definition through the provider-job proof adapter. The request accepts provider id, benchmark id, and prototype adapter mode only; prompt and output text are never accepted or stored.
      security:
        - adminToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [providerId]
              properties:
                providerId:
                  type: string
                benchmarkId:
                  type: string
                  enum: [tiny_smoke, small_chat, summary_batch]
                adapterMode:
                  type: string
                  enum: [mock_success, mock_failure, mock_timeout, provider_http]
      responses:
        '200':
          description: Benchmark run completed
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  run:
                    $ref: '#/components/schemas/BenchmarkRun'
                  receipt:
                    $ref: '#/components/schemas/ProviderJobReceipt'
        '400':
          description: Invalid benchmark request
        '401':
          description: Admin token required
        '403':
          description: Provider is not selected for the benchmark workload
  /api/proof/market-making:
    get:
      summary: Public-safe market-making routing and cost report
      responses:
        '200':
          description: Market-making report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketMakingSummary'
  /api/proof/payouts:
    get:
      summary: Public-safe provider payout accounting summary
      parameters:
        - in: query
          name: provider
          schema:
            type: string
          description: Provider id or public label substring.
        - in: query
          name: providerId
          schema:
            type: string
        - in: query
          name: state
          schema:
            type: string
            enum: [accrued, review, approved, paid, disputed, voided]
        - in: query
          name: eventType
          schema:
            type: string
            enum: [job_accrued, benchmark_stipend, manual_adjustment, refund, payout_approved, payout_paid, payout_voided]
        - in: query
          name: sourceReceiptId
          schema:
            type: string
        - in: query
          name: from
          schema:
            type: string
          description: Inclusive createdAt lower bound.
        - in: query
          name: to
          schema:
            type: string
          description: Inclusive createdAt upper bound.
        - in: query
          name: limit
          schema:
            type: integer
            default: 100
            minimum: 1
            maximum: 500
      responses:
        '200':
          description: Provider payout summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayoutSummary'
    post:
      summary: Admin-only manual provider payout event
      security:
        - adminToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [providerId, amountUsd, reason]
              properties:
                providerId:
                  type: string
                providerLabel:
                  type: string
                sourceReceiptId:
                  type: string
                  nullable: true
                sourceReceiptHash:
                  type: string
                  nullable: true
                sourceSignatureStatus:
                  type: string
                  enum: [not_required, valid, invalid, missing]
                  nullable: true
                eventType:
                  type: string
                  enum: [job_accrued, benchmark_stipend, manual_adjustment, refund, payout_approved, payout_paid, payout_voided]
                amount:
                  type: number
                currency:
                  type: string
                amountUsd:
                  type: number
                state:
                  type: string
                  enum: [accrued, review, approved, paid, disputed, voided]
                operatorOwner:
                  type: string
                reason:
                  type: string
                transactionRef:
                  type: string
                  nullable: true
      responses:
        '201':
          description: Payout event created
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  event:
                    $ref: '#/components/schemas/OperatorPayoutEvent'
  /api/proof/payouts/batches:
    get:
      summary: Admin-only payout batch list
      security:
        - adminToken: []
      responses:
        '200':
          description: Payout batch list
          content:
            application/json:
              schema:
                type: object
                properties:
                  object:
                    type: string
                    example: list
                  dataState:
                    type: string
                    enum: [live, snapshot, sample, unavailable]
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PayoutBatch'
    post:
      summary: Admin-only payout review batch creation
      security:
        - adminToken: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                eventIds:
                  type: array
                  items:
                    type: string
                states:
                  type: array
                  items:
                    type: string
                    enum: [accrued, review, approved, paid, disputed, voided]
                operatorOwner:
                  type: string
                reason:
                  type: string
      responses:
        '201':
          description: Payout batch created
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  batch:
                    $ref: '#/components/schemas/PayoutBatch'
  /api/proof/payouts/batches/{batchId}/export:
    get:
      summary: Admin-only payout batch CSV export
      security:
        - adminToken: []
      parameters:
        - in: path
          name: batchId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: CSV export for one payout batch and its payable events
          content:
            text/csv:
              schema:
                type: string
        '401':
          description: Admin token required
        '404':
          description: Payout batch not found
  /api/proof/payouts/export:
    get:
      summary: Admin-only provider payout CSV export
      security:
        - adminToken: []
      parameters:
        - in: query
          name: provider
          schema:
            type: string
        - in: query
          name: providerId
          schema:
            type: string
        - in: query
          name: state
          schema:
            type: string
            enum: [accrued, review, approved, paid, disputed, voided]
        - in: query
          name: eventType
          schema:
            type: string
            enum: [job_accrued, benchmark_stipend, manual_adjustment, refund, payout_approved, payout_paid, payout_voided]
        - in: query
          name: limit
          schema:
            type: integer
            default: 100
            minimum: 1
            maximum: 500
      responses:
        '200':
          description: CSV payout event export
          content:
            text/csv:
              schema:
                type: string
  /api/ocean/refresh:
    post:
      summary: Trigger a refresh of Ocean Network supply snapshots
      responses:
        '200':
          description: Refresh result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OceanSummary'
  /api/usage/summary:
    get:
      summary: Fish usage proof summary
      responses:
        '200':
          description: Usage summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  dataState:
                    type: string
                    enum: [live, snapshot, sample, unavailable]
                  requests:
                    type: integer
                  oceanNativeJobs:
                    type: integer
                  providerPayoutUsd:
                    type: number
                  creditsSpent:
                    type: number
                  creditsRemaining:
                    type: number
                  userChargeUsd:
                    type: number
                  providerCostUsd:
                    type: number
                  grossMarginUsd:
                    type: number
                  lastReceiptAt:
                    type: string
                    nullable: true
                  message:
                    type: string
  /api/staking/summary:
    get:
      summary: Public offchain OCEAN staking credit summary
      responses:
        '200':
          description: Staking credit summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StakingCreditSummary'
  /api/staking/positions:
    get:
      summary: Public offchain OCEAN staking positions
      responses:
        '200':
          description: Public staking positions
          content:
            application/json:
              schema:
                type: object
                properties:
                  object:
                    type: string
                    example: list
                  dataState:
                    type: string
                    enum: [live, snapshot, sample, unavailable]
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PublicStakingPosition'
    post:
      summary: Admin-only offchain OCEAN stake record and Fish Credit issuance
      security:
        - adminToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [walletRef, oceanAmount]
              properties:
                holderLabel:
                  type: string
                walletRef:
                  type: string
                oceanAmount:
                  type: number
                lockDays:
                  type: integer
                budgetId:
                  type: string
                issueApiKey:
                  type: boolean
      responses:
        '201':
          description: Staking position recorded and credits issued when budget allows
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  position:
                    $ref: '#/components/schemas/PublicStakingPosition'
                  apiKey:
                    type: string
                    nullable: true
                  keyNotice:
                    type: string
                    nullable: true
        '401':
          description: Admin token required
  /api/waitlist:
    post:
      summary: Submit user/developer waitlist interest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WaitlistRequest'
      responses:
        '200':
          description: Submission accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  id:
                    type: string
  /api/providers/apply:
    post:
      summary: Submit provider pilot application
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProviderApplication'
      responses:
        '200':
          description: Application accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  id:
                    type: string
  /v1/api_keys:
    post:
      summary: Create a prototype Fish API key
      description: Requires an admin token in production. The returned key is shown once and stored only as a hash.
      security:
        - adminToken: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                label:
                  type: string
                creditGrant:
                  type: integer
                  minimum: 1
                  maximum: 100000
                planId:
                  type: string
                  enum: [free, pro, team-api, provider-test]
                  default: free
      responses:
        '200':
          description: Prototype key created
          content:
            application/json:
              schema:
                type: object
                properties:
                  object:
                    type: string
                    example: api_key
                  key:
                    type: string
                  keyNotice:
                    type: string
                  account:
                    $ref: '#/components/schemas/FishAccount'
  /v1/models:
    get:
      summary: List prototype Fish models and dish aliases
      responses:
        '200':
          description: Model list
          content:
            application/json:
              schema:
                type: object
                properties:
                  object:
                    type: string
                    example: list
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/FishModel'
  /v1/chat/completions:
    post:
      summary: Create a prototype chat completion
      description: OpenAI-style route that requires a Fish API key, debits credits, writes a usage receipt, and can optionally call a configured external compatible backend. Dish model aliases such as `fish-ask`, `fish-code`, `fish-docs`, and `fish-ocean-helper` apply the matching Fish feature policy without requiring metadata.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FishChatRequest'
      responses:
        '200':
          description: Chat completion. When `stream` is true, the same settled completion is returned as OpenAI-style server-sent events.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FishChatCompletion'
            text/event-stream:
              schema:
                type: string
        '400':
          description: Invalid request or unknown Fish model
        '401':
          description: Fish API key required
        '402':
          description: Insufficient Fish credits
        '403':
          description: Model or external fallback is not allowed for this plan
        '429':
          description: Daily quota or route budget exceeded
        '503':
          description: Selected route is unavailable
  /v1/balance:
    get:
      summary: Get prototype account balance
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Balance
          content:
            application/json:
              schema:
                type: object
                properties:
                  object:
                    type: string
                    example: balance
                  account:
                    $ref: '#/components/schemas/FishAccount'
                  creditLanes:
                    type: array
                    items:
                      $ref: '#/components/schemas/FishCreditLane'
                  totals:
                    $ref: '#/components/schemas/FishUsageTotals'
  /v1/usage:
    get:
      summary: List recent prototype usage receipts
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Usage receipts
          content:
            application/json:
              schema:
                type: object
                properties:
                  object:
                    type: string
                    example: list
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/FishUsageReceipt'
                  creditLanes:
                    type: array
                    items:
                      $ref: '#/components/schemas/FishCreditLane'
                  totals:
                    $ref: '#/components/schemas/FishUsageTotals'
