      required: [inputRef]
      properties:
        taskType:
          type: string
          enum: [document_summary, structured_extraction, embeddings, batch_chat]
          default: document_summary
        inputRef:
          type: string
          description: Hash or storage reference for the batch input. Raw document text must not be submitted.
        estimatedInputTokens:
          type: integer
          minimum: 1
          maximum: 200000
        maxOutputTokens:
          type: integer
          minimum: 1
          maximum: 8192
          default: 512
        maxRuntimeSeconds:
          type: integer
          minimum: 1
          maximum: 3600
          default: 600
        maxCostUsd:
          type: number
          minimum: 0
          maximum: 100
          default: 1
        adapterMode:
          type: string
          enum: [sample_success, sample_failure, ocean_http]
          default: sample_success
    ProviderSmokeRequest:
      type: object
