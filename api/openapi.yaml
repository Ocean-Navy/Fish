openapi: 3.0.3
info:
  title: Fish Landing + Dashboard API
  version: 0.1.0
  description: API contract for the Fish landing page, Ocean Network supply dashboard, provider pilot, and waitlist.
servers:
  - url: http://127.0.0.1:3000
paths:
  /api/health:
    get:
      summary: Health check
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  service:
                    type: string
                  timestamp:
                    type: string
  /api/ocean/summary:
    get:
      summary: Aggregate Ocean Network compute supply and usage summary
      responses:
        '200':
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OceanSummary'
  /api/ocean/resources:
    get:
      summary: Normalized compute resources
      responses:
        '200':
          description: Resource list
          content:
            application/json:
              schema:
                type: object
                properties:
                  dataState:
                    type: string
                    enum: [live, snapshot, sample, unavailable]
                  lastUpdated:
                    type: string
                  resources:
                    type: array
                    items:
                      $ref: '#/components/schemas/ComputeResource'
  /api/ocean/providers:
    get:
      summary: Provider scorecard
      responses:
        '200':
          description: Provider list
          content:
            application/json:
              schema:
                type: object
                properties:
                  dataState:
                    type: string
                    enum: [live, snapshot, sample, unavailable]
                  lastUpdated:
                    type: string
                  providers:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProviderScore'
  /api/providers/pilot:
    get:
      summary: Public-safe provider pilot registry and selected allowlist
      parameters:
        - in: query
          name: providerId
          schema:
            type: string
          description: Optional provider id to check against the allowlist.
        - in: query
          name: workloadType
          schema:
            type: string
            default: chat_batch
        - in: query
          name: model
          schema:
            type: string
            default: fish-demo-chat
      responses:
        '200':
          description: Provider pilot registry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderPilotRegistry'
  /api/providers/pilot/export:
    get:
      summary: Admin-only provider pilot outreach export
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Provider pilot operator export with private outreach fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderPilotOperatorExport'
  /api/providers/jobs:
    post:
      summary: Run a selected-provider prototype batch job
      description: Admin-only controlled adapter. Checks provider allowlist, never stores prompt/output text, and writes a public-safe signed provider job receipt.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [providerId, inputRef]
              properties:
                providerId:
                  type: string
                workloadType:
                  type: string
                  default: chat_batch
                model:
                  type: string
                  default: fish-demo-chat
                inputRef:
                  type: string
                  description: Hash or reference for the job input. Raw prompt text must not be submitted.
                parameters:
                  type: object
                  properties:
                    maxOutputTokens:
                      type: integer
                    temperature:
                      type: number
                maxRuntimeSeconds:
                  type: integer
                maxCostUsd:
                  type: number
                adapterMode:
                  type: string
                  enum: [mock_success, mock_failure, mock_timeout]
      responses:
        '200':
          description: Provider job completed
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  receipt:
                    $ref: '#/components/schemas/ProviderJobReceipt'
  /api/proof/summary:
    get:
      summary: Public proof dashboard summary
      responses:
        '200':
          description: Public proof summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProofSummary'
  /api/proof/receipts:
    get:
      summary: Public-safe provider job receipts
      responses:
        '200':
          description: Receipt list
          content:
            application/json:
              schema:
                type: object
                properties:
                  object:
                    type: string
                    example: list
                  dataState:
                    type: string
                    enum: [live, snapshot, sample, unavailable]
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProviderJobReceipt'
  /api/ocean/refresh:
    post:
      summary: Trigger a refresh of Ocean Network supply snapshots
      responses:
        '200':
          description: Refresh result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OceanSummary'
  /api/usage/summary:
    get:
      summary: Fish usage proof summary
      responses:
        '200':
          description: Usage summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  dataState:
                    type: string
                    enum: [live, snapshot, sample, unavailable]
                  requests:
                    type: integer
                  oceanNativeJobs:
                    type: integer
                  providerPayoutUsd:
                    type: number
                  creditsSpent:
                    type: number
                  creditsRemaining:
                    type: number
                  userChargeUsd:
                    type: number
                  providerCostUsd:
                    type: number
                  grossMarginUsd:
                    type: number
                  lastReceiptAt:
                    type: string
                    nullable: true
                  message:
                    type: string
  /api/waitlist:
    post:
      summary: Submit user/developer waitlist interest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WaitlistRequest'
      responses:
        '200':
          description: Submission accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  id:
                    type: string
  /api/providers/apply:
    post:
      summary: Submit provider pilot application
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProviderApplication'
      responses:
        '200':
          description: Application accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  id:
                    type: string
  /v1/api_keys:
    post:
      summary: Create a prototype Fish API key
      description: Requires an admin token in production. The returned key is shown once and stored only as a hash.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                label:
                  type: string
                creditGrant:
                  type: integer
                  minimum: 1
                  maximum: 100000
      responses:
        '200':
          description: Prototype key created
          content:
            application/json:
              schema:
                type: object
                properties:
                  object:
                    type: string
                    example: api_key
                  key:
                    type: string
                  keyNotice:
                    type: string
                  account:
                    $ref: '#/components/schemas/FishAccount'
  /v1/models:
    get:
      summary: List prototype Fish models
      responses:
        '200':
          description: Model list
          content:
            application/json:
              schema:
                type: object
                properties:
                  object:
                    type: string
                    example: list
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/FishModel'
  /v1/chat/completions:
    post:
      summary: Create a prototype chat completion
      description: OpenAI-style mock route that requires a Fish API key, debits credits, and writes a usage receipt.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [messages]
              properties:
                model:
                  type: string
                  default: fish-demo-chat
                messages:
                  type: array
                  items:
                    type: object
                    properties:
                      role:
                        type: string
                        enum: [system, user, assistant, tool]
                      content:
                        oneOf:
                          - type: string
                          - type: array
                            items: {}
                stream:
                  type: boolean
                  default: false
                temperature:
                  type: number
                max_tokens:
                  type: integer
      responses:
        '200':
          description: Chat completion
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FishChatCompletion'
  /v1/balance:
    get:
      summary: Get prototype account balance
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Balance
          content:
            application/json:
              schema:
                type: object
                properties:
                  object:
                    type: string
                    example: balance
                  account:
                    $ref: '#/components/schemas/FishAccount'
                  totals:
                    $ref: '#/components/schemas/FishUsageTotals'
  /v1/usage:
    get:
      summary: List recent prototype usage receipts
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Usage receipts
          content:
            application/json:
              schema:
                type: object
                properties:
                  object:
                    type: string
                    example: list
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/FishUsageReceipt'
                  totals:
                    $ref: '#/components/schemas/FishUsageTotals'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    OceanSummary:
      type: object
      required: [dataState, lastUpdated, kpis]
      properties:
        dataState:
          type: string
          enum: [live, snapshot, sample, unavailable]
        lastUpdated:
          type: string
        sources:
          type: array
          items:
            type: object
        sourceCount:
          type: integer
        warnings:
          type: array
          items:
            type: string
        kpis:
          type: object
          properties:
            totalGpus:
              type: number
            availableGpus:
              type: number
            providerCount:
              type: integer
            h200FromUsdHr:
              type: number
              nullable: true
            lowestListedGpuFee:
              type: number
              nullable: true
            oceanNativeJobs:
              type: integer
            benchmarkJobs:
              type: integer
            providerPayoutUsd:
              type: number
              nullable: true
            networkRevenueUsd:
              type: number
              nullable: true
        gpuSupply:
          type: array
          items:
            $ref: '#/components/schemas/GpuSupplyRow'
        providers:
          type: array
          items:
            $ref: '#/components/schemas/ProviderScore'
    GpuSupplyRow:
      type: object
      properties:
        gpu:
          type: string
        total:
          type: number
        available:
          type: number
        providers:
          type: integer
        lowestUsdHr:
          type: number
          nullable: true
        medianUsdHr:
          type: number
          nullable: true
        lowestListedPrice:
          type: number
          nullable: true
        regions:
          type: array
          items:
            type: string
    ComputeResource:
      type: object
      properties:
        timestamp:
          type: string
        source:
          type: string
        providerId:
          type: string
        providerLabel:
          type: string
        nodeEndpoint:
          type: string
        environmentId:
          type: string
        region:
          type: string
        resourceType:
          type: string
        resourceName:
          type: string
        total:
          type: number
        inUse:
          type: number
        available:
          type: number
        feeToken:
          type: string
        pricePerMinute:
          type: number
          nullable: true
        pricePerHour:
          type: number
          nullable: true
        listedPrice:
          type: number
          nullable: true
        priceBasis:
          type: string
        status:
          type: string
    ProviderScore:
      type: object
      properties:
        providerId:
          type: string
        label:
          type: string
        region:
          type: string
        gpuTypes:
          type: array
          items:
            type: string
        availableGpus:
          type: number
        lowestUsdHr:
          type: number
          nullable: true
        lowestListedPrice:
          type: number
          nullable: true
        uptime7d:
          type: number
        benchmarkStatus:
          type: string
        pilotEligible:
          type: boolean
    ProviderPilotRegistry:
      type: object
      properties:
        dataState:
          type: string
          enum: [live, snapshot, sample, unavailable]
        lastUpdated:
          type: string
        counts:
          type: object
          properties:
            applications:
              type: integer
            applied:
              type: integer
            allowed:
              type: integer
            paused:
              type: integer
            rejected:
              type: integer
        providers:
          type: array
          items:
            $ref: '#/components/schemas/ProviderPilotProfile'
        allowlist:
          type: array
          items:
            $ref: '#/components/schemas/ProviderAllowlistEntry'
        warnings:
          type: array
          items:
            type: string
        allowedFor:
          nullable: true
          type: object
    ProviderPilotProfile:
      type: object
      properties:
        providerId:
          type: string
        displayName:
          type: string
        sourceApplicationId:
          type: string
          nullable: true
        nodeEndpointHash:
          type: string
          nullable: true
        region:
          type: string
        gpuTypes:
          type: array
          items:
            type: string
        capacitySummary:
          type: string
        pilotStatus:
          type: string
          enum: [applied, contacted, verified, allowed, probation, paused, rejected, exited]
        publicLabel:
          type: string
        createdAt:
          type: string
        updatedAt:
          type: string
    ProviderAllowlistEntry:
      type: object
      properties:
        providerId:
          type: string
        allowedWorkloadTypes:
          type: array
          items:
            type: string
        allowedModels:
          type: array
          items:
            type: string
        maxConcurrentJobs:
          type: integer
        maxDailySpendUsd:
          type: number
        benchmarkRequired:
          type: boolean
        operatorOwner:
          type: string
        decisionReason:
          type: string
        startsAt:
          type: string
        expiresAt:
          type: string
          nullable: true
    ProviderPilotOperatorExport:
      type: object
      properties:
        exportedAt:
          type: string
        rows:
          type: array
          items:
            type: object
            properties:
              providerId:
                type: string
              sourceApplicationId:
                type: string
              pilotStatus:
                type: string
              contact:
                type: string
              nodeEndpoint:
                type: string
              nodeEndpointHash:
                type: string
                nullable: true
              gpuType:
                type: string
              region:
                type: string
              payoutPreference:
                type: string
              notes:
                type: string
              publicLabel:
                type: string
              createdAt:
                type: string
    ProviderJobReceipt:
      type: object
      properties:
        receiptVersion:
          type: integer
        receiptType:
          type: string
          example: provider_job_receipt
        receiptId:
          type: string
        jobId:
          type: string
        providerJobId:
          type: string
          nullable: true
        providerId:
          type: string
        providerLabel:
          type: string
        model:
          type: string
        workloadType:
          type: string
        backend:
          type: string
          enum: [ocean_provider]
        status:
          type: string
          enum: [succeeded, failed, timed_out, not_allowed]
        sourceState:
          type: string
          enum: [live, snapshot, sample, unavailable]
        visibility:
          type: string
        createdAt:
          type: string
        startedAt:
          type: string
        completedAt:
          type: string
        usage:
          type: object
        cost:
          type: object
        hashes:
          type: object
          properties:
            inputHash:
              type: string
            outputHash:
              type: string
              nullable: true
            canonicalReceiptHash:
              type: string
        signer:
          type: object
          properties:
            keyId:
              type: string
            algorithm:
              type: string
              enum: [none, ed25519]
            publicKeyPem:
              type: string
              nullable: true
        signatureStatus:
          type: string
          enum: [not_required, valid, invalid, missing]
        signature:
          type: string
          nullable: true
        errorCode:
          type: string
          nullable: true
    ProofSummary:
      type: object
      properties:
        dataState:
          type: string
          enum: [live, snapshot, sample, unavailable]
        lastUpdated:
          type: string
        oceanJobsRouted:
          type: integer
        verifiedReceipts:
          type: integer
        pilotProviders:
          type: integer
        providerPayoutUsd:
          type: number
        benchmarkPassRate:
          type: number
          nullable: true
        oceanNativeShare:
          type: number
        failedJobs:
          type: integer
        timedOutJobs:
          type: integer
        receiptVerificationFailures:
          type: integer
        receipts:
          type: array
          items:
            $ref: '#/components/schemas/ProviderJobReceipt'
        warnings:
          type: array
          items:
            type: string
    WaitlistRequest:
      type: object
      required: [contact, subscriberRoles]
      properties:
        contact:
          type: string
        subscriberRoles:
          type: array
          items:
            type: string
            enum: [user, developer, provider, oceanHolder]
        useCase:
          type: string
        expectedUsage:
          type: string
        nodeEndpoint:
          type: string
        gpuType:
          type: string
        region:
          type: string
        payoutPreference:
          type: string
        notes:
          type: string
        apiInterest:
          type: boolean
        oceanHolder:
          type: boolean
    FishAccount:
      type: object
      properties:
        id:
          type: string
        label:
          type: string
        createdAt:
          type: string
        creditBalance:
          type: integer
        totalCreditsGranted:
          type: integer
        totalCreditsSpent:
          type: integer
        requestCount:
          type: integer
        lastUsedAt:
          type: string
          nullable: true
    FishModel:
      type: object
      properties:
        id:
          type: string
        object:
          type: string
          example: model
        created:
          type: integer
        owned_by:
          type: string
        description:
          type: string
    FishUsageTotals:
      type: object
      properties:
        requests:
          type: integer
        creditsSpent:
          type: integer
        creditsRemaining:
          type: integer
        userChargeUsd:
          type: number
        providerCostUsd:
          type: number
        grossMarginUsd:
          type: number
    FishUsageReceipt:
      type: object
      properties:
        id:
          type: string
        accountId:
          type: string
        createdAt:
          type: string
        model:
          type: string
        route:
          type: string
          enum: [mock, ocean-provider, external-fallback]
        costState:
          type: string
          enum: [prototype_estimate, provider_verified, fallback_verified]
        promptTokens:
          type: integer
        completionTokens:
          type: integer
        totalTokens:
          type: integer
        creditsSpent:
          type: integer
        userChargeUsd:
          type: number
        providerCostUsd:
          type: number
        grossMarginUsd:
          type: number
        providerId:
          type: string
          nullable: true
        requestHash:
          type: string
    FishChatCompletion:
      type: object
      properties:
        id:
          type: string
        object:
          type: string
          example: chat.completion
        created:
          type: integer
        model:
          type: string
        choices:
          type: array
          items:
            type: object
        usage:
          type: object
          properties:
            prompt_tokens:
              type: integer
            completion_tokens:
              type: integer
            total_tokens:
              type: integer
        fish:
          type: object
          properties:
            route:
              type: string
            costState:
              type: string
            receiptId:
              type: string
            creditsSpent:
              type: integer
            creditsRemaining:
              type: integer
            userChargeUsd:
              type: number
            providerCostUsd:
              type: number
            grossMarginUsd:
              type: number
    ProviderApplication:
      type: object
      required: [contact]
      properties:
        contact:
          type: string
        subscriberRoles:
          type: array
          items:
            type: string
            enum: [user, developer, provider, oceanHolder]
        nodeEndpoint:
          type: string
        gpuType:
          type: string
        region:
          type: string
        payoutPreference:
          type: string
        notes:
          type: string
