services:
  vllm:
    image: vllm/vllm-openai:latest
    restart: unless-stopped
    ipc: host
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      HUGGING_FACE_HUB_TOKEN: ${HUGGING_FACE_HUB_TOKEN:-}
      HF_HOME: /root/.cache/huggingface
    volumes:
      - vllm-hf-cache:/root/.cache/huggingface
    command:
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --api-key
      - ${FISH_VLLM_API_KEY:?set FISH_VLLM_API_KEY}
      - --model
      - ${FISH_VLLM_MODEL:?set FISH_VLLM_MODEL}
      - --served-model-name
      - ${FISH_VLLM_SERVED_MODEL_NAME:-fish-warm-chat}
      - --max-model-len
      - ${FISH_VLLM_MAX_MODEL_LEN:-4096}
      - --gpu-memory-utilization
      - ${FISH_VLLM_GPU_MEMORY_UTILIZATION:-0.88}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities:
                - gpu

  fish-runner:
    image: node:22-slim
    restart: unless-stopped
    depends_on:
      - vllm
    working_dir: /app
    ports:
      - "127.0.0.1:8088:8088"
    volumes:
      - ./fish-runner.mjs:/app/fish-runner.mjs:ro
    environment:
      FISH_RUNNER_HOST: 0.0.0.0
      FISH_RUNNER_PORT: "8088"
      FISH_RUNNER_ID: ${FISH_RUNNER_ID:-runner_ocean_navy_demo}
      FISH_RUNNER_PROVIDER_ID: ${FISH_RUNNER_PROVIDER_ID:-ocean-navy-demo-node}
      FISH_RUNNER_API_KEY: ${FISH_RUNNER_API_KEY:?set FISH_RUNNER_API_KEY}
      FISH_RUNNER_VLLM_BASE_URL: http://vllm:8000/v1
      FISH_RUNNER_VLLM_API_KEY: ${FISH_VLLM_API_KEY:?set FISH_VLLM_API_KEY}
      FISH_RUNNER_MODELS: ${FISH_VLLM_SERVED_MODEL_NAME:-fish-warm-chat}
      FISH_RUNNER_CONTEXT_TOKENS: ${FISH_VLLM_MAX_MODEL_LEN:-4096}
      FISH_RUNNER_PRICE_USD_PER_1K_TOKENS: ${FISH_RUNNER_PRICE_USD_PER_1K_TOKENS:-0}
      FISH_RUNNER_MAX_QUEUE: ${FISH_RUNNER_MAX_QUEUE:-2}
      FISH_RUNNER_SIGNING_PRIVATE_KEY_PEM: ${FISH_RUNNER_SIGNING_PRIVATE_KEY_PEM:-}
      FISH_RUNNER_SIGNING_KEY_ID: ${FISH_RUNNER_SIGNING_KEY_ID:-runner-ocean-navy-demo-ed25519}
    command:
      - node
      - /app/fish-runner.mjs

volumes:
  vllm-hf-cache:
