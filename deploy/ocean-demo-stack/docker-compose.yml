services:
  ocean-typesense:
    image: ${OCEAN_TYPESENSE_IMAGE:-typesense/typesense:26.0}
    restart: unless-stopped
    command: "--data-dir /data --api-key=${TYPESENSE_API_KEY:-change-me-typesense-key}"
    ports:
      - "${TYPESENSE_BIND:-127.0.0.1}:${TYPESENSE_PORT:-8108}:8108"
    volumes:
      - ocean-typesense-data:/data
    networks:
      - fish-ocean-demo

  ocean-node:
    image: ${OCEAN_NODE_IMAGE:-oceanprotocol/ocean-node:latest}
    pull_policy: always
    restart: unless-stopped
    depends_on:
      - ocean-typesense
    ports:
      - "${OCEAN_NODE_HTTP_BIND:-127.0.0.1}:${OCEAN_NODE_HTTP_PORT:-8000}:8000"
      - "${OCEAN_NODE_P2P_BIND:-0.0.0.0}:${OCEAN_NODE_P2P_TCP_PORT:-9000}:9000"
      - "${OCEAN_NODE_P2P_BIND:-0.0.0.0}:${OCEAN_NODE_P2P_WS_PORT:-9001}:9001"
      - "${OCEAN_NODE_P2P_BIND:-0.0.0.0}:${OCEAN_NODE_P2P_V6_TCP_PORT:-9002}:9002"
      - "${OCEAN_NODE_P2P_BIND:-0.0.0.0}:${OCEAN_NODE_P2P_V6_WS_PORT:-9003}:9003"
    environment:
      PRIVATE_KEY: ${OCEAN_NODE_PRIVATE_KEY:-}
      RPCS: ${OCEAN_NODE_RPCS:-{"8453":{"rpc":"https://mainnet.base.org","chainId":8453,"network":"base","chunkSize":100},"84532":{"rpc":"https://sepolia.base.org","chainId":84532,"network":"base-sepolia","chunkSize":100}}}
      DB_URL: http://ocean-typesense:8108/?apiKey=${TYPESENSE_API_KEY:-change-me-typesense-key}
      IPFS_GATEWAY: ${OCEAN_NODE_IPFS_GATEWAY:-https://ipfs.io/}
      ARWEAVE_GATEWAY: ${OCEAN_NODE_ARWEAVE_GATEWAY:-https://arweave.net/}
      INTERFACES: ${OCEAN_NODE_INTERFACES:-["HTTP","P2P"]}
      ALLOWED_ADMINS: ${OCEAN_NODE_ALLOWED_ADMINS:-[]}
      INDEXER_NETWORKS: ${OCEAN_NODE_INDEXER_NETWORKS:-[]}
      DOCKER_COMPUTE_ENVIRONMENTS: ${OCEAN_NODE_DOCKER_COMPUTE_ENVIRONMENTS:-[]}
      PERSISTENT_STORAGE: ${OCEAN_NODE_PERSISTENT_STORAGE:-{"enabled":true,"type":"localfs","accessLists":[],"options":{"folder":"/tmp/ocean-node-persistent-storage"}}}
      JWT_SECRET: ${OCEAN_NODE_JWT_SECRET:-change-me-ocean-node-jwt}
      LOG_CONSOLE: ${OCEAN_NODE_LOG_CONSOLE:-true}
      LOG_LEVEL: ${OCEAN_NODE_LOG_LEVEL:-info}
      HTTP_API_PORT: "8000"
      P2P_ENABLE_IPV4: ${OCEAN_NODE_P2P_ENABLE_IPV4:-true}
      P2P_ENABLE_IPV6: ${OCEAN_NODE_P2P_ENABLE_IPV6:-false}
      P2P_ipV4BindAddress: 0.0.0.0
      P2P_ipV4BindTcpPort: "9000"
      P2P_ipV4BindWsPort: "9001"
      P2P_ipV6BindAddress: "::"
      P2P_ipV6BindTcpPort: "9002"
      P2P_ipV6BindWsPort: "9003"
      P2P_ANNOUNCE_ADDRESSES: ${OCEAN_NODE_P2P_ANNOUNCE_ADDRESSES:-[]}
      P2P_ANNOUNCE_PRIVATE: ${OCEAN_NODE_P2P_ANNOUNCE_PRIVATE:-false}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ocean-node-data:/data
    networks:
      - fish-ocean-demo

  ocean-workload-adapter:
    image: node:22-slim
    restart: unless-stopped
    depends_on:
      - ocean-node
    working_dir: /workspace
    ports:
      - "${OCEAN_WORKLOAD_ADAPTER_BIND:-127.0.0.1}:${OCEAN_WORKLOAD_ADAPTER_PORT:-8787}:8787"
    volumes:
      - ../ocean-workload-adapter/server.mjs:/app/server.mjs:ro
      - ../../.deps/ocean-cli:/ocean-cli:ro
      - ocean-workload-adapter-data:/data/ocean-workload-adapter
    environment:
      OCEAN_WORKLOAD_ADAPTER_HOST: 0.0.0.0
      OCEAN_WORKLOAD_ADAPTER_PORT: "8787"
      OCEAN_WORKLOAD_ADAPTER_MODE: ${OCEAN_WORKLOAD_ADAPTER_MODE:-dry_run}
      OCEAN_WORKLOAD_ADAPTER_API_KEY: ${OCEAN_WORKLOAD_ADAPTER_API_KEY:-change-me-adapter-key}
      OCEAN_WORKLOAD_ADAPTER_DATA_DIR: /data/ocean-workload-adapter
      OCEAN_CLI_DIR: ${OCEAN_CLI_DIR:-/ocean-cli}
      FISH_OCEAN_CLI_BIN: ${FISH_OCEAN_CLI_BIN:-}
      PRIVATE_KEY: ${OCEAN_PROOF_PRIVATE_KEY:-}
      MNEMONIC: ${OCEAN_PROOF_MNEMONIC:-}
      RPC: ${OCEAN_PROOF_RPC:-}
      ADDRESS_FILE: ${ADDRESS_FILE:-}
      AVOID_LOOP_RUN: ${AVOID_LOOP_RUN:-true}
      NODE_URL: ${NODE_URL:-http://ocean-node:8000}
      FISH_OCEAN_DATASET_DIDS: ${FISH_OCEAN_DATASET_DIDS:-[]}
      FISH_OCEAN_ALGO_DID: ${FISH_OCEAN_ALGO_DID:-}
      FISH_OCEAN_COMPUTE_ENV_ID: ${FISH_OCEAN_COMPUTE_ENV_ID:-}
      FISH_ALGORITHM_FILE_URL: ${FISH_ALGORITHM_FILE_URL:-}
      FISH_OCEAN_PAYMENT_TOKEN: ${FISH_OCEAN_PAYMENT_TOKEN:-}
      FISH_OCEAN_RESOURCES: ${FISH_OCEAN_RESOURCES:-}
      FISH_OCEAN_ADAPTER_PROVIDER_COST_USD: ${FISH_OCEAN_ADAPTER_PROVIDER_COST_USD:-0}
      FISH_OCEAN_OUTPUT: ${FISH_OCEAN_OUTPUT:-}
      FISH_OCEAN_LOCAL_BASE_IMAGE: ${FISH_OCEAN_LOCAL_BASE_IMAGE:-python:3.11-slim}
      FISH_OCEAN_LOCAL_RESOURCES: ${FISH_OCEAN_LOCAL_RESOURCES:-}
      FISH_OCEAN_LOCAL_RESULT_TIMEOUT_MS: ${FISH_OCEAN_LOCAL_RESULT_TIMEOUT_MS:-900000}
      FISH_OCEAN_START_FREE_COMMAND: ${FISH_OCEAN_START_FREE_COMMAND:-startFreeCompute}
      FISH_OCEAN_START_PAID_COMMAND: ${FISH_OCEAN_START_PAID_COMMAND:-startCompute}
      FISH_OCEAN_DOWNLOAD_COMMAND: ${FISH_OCEAN_DOWNLOAD_COMMAND:-downloadJobResults}
      FISH_OCEAN_DOWNLOAD_ARGS_TEMPLATE: ${FISH_OCEAN_DOWNLOAD_ARGS_TEMPLATE:-{jobId} {index} {outputDir}}
      FISH_OCEAN_RESULT_INDEX: ${FISH_OCEAN_RESULT_INDEX:-0}
      FISH_OCEAN_RESULT_TIMEOUT_MS: ${FISH_OCEAN_RESULT_TIMEOUT_MS:-900000}
      FISH_OCEAN_POLL_INTERVAL_MS: ${FISH_OCEAN_POLL_INTERVAL_MS:-15000}
    command:
      - node
      - /app/server.mjs
    networks:
      - fish-ocean-demo

  vllm:
    image: ${FISH_VLLM_IMAGE:-vllm/vllm-openai:latest}
    profiles:
      - warm
    restart: unless-stopped
    ipc: host
    ports:
      - "${FISH_VLLM_BIND:-127.0.0.1}:${FISH_VLLM_PORT:-8000}:8000"
    environment:
      HUGGING_FACE_HUB_TOKEN: ${HUGGING_FACE_HUB_TOKEN:-}
      HF_HOME: /root/.cache/huggingface
    volumes:
      - vllm-hf-cache:/root/.cache/huggingface
    command:
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --api-key
      - ${FISH_VLLM_API_KEY:-change-me-vllm-key}
      - --model
      - ${FISH_VLLM_MODEL:-Qwen/Qwen3-8B}
      - --served-model-name
      - ${FISH_VLLM_SERVED_MODEL_NAME:-fish-warm-chat}
      - --max-model-len
      - ${FISH_VLLM_MAX_MODEL_LEN:-4096}
      - --gpu-memory-utilization
      - ${FISH_VLLM_GPU_MEMORY_UTILIZATION:-0.88}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities:
                - gpu
    networks:
      - fish-ocean-demo

  fish-runner:
    image: node:22-slim
    profiles:
      - warm
    restart: unless-stopped
    depends_on:
      - vllm
    working_dir: /app
    ports:
      - "${FISH_RUNNER_BIND:-127.0.0.1}:${FISH_RUNNER_PORT:-8088}:8088"
    volumes:
      - ../warm-inference/fish-runner.mjs:/app/fish-runner.mjs:ro
    environment:
      FISH_RUNNER_HOST: 0.0.0.0
      FISH_RUNNER_PORT: "8088"
      FISH_RUNNER_ID: ${FISH_RUNNER_ID:-runner_ocean_navy_demo}
      FISH_RUNNER_PROVIDER_ID: ${FISH_RUNNER_PROVIDER_ID:-ocean-navy-demo-node}
      FISH_RUNNER_API_KEY: ${FISH_RUNNER_API_KEY:-change-me-runner-key}
      FISH_RUNNER_ENGINE_TYPE: vllm
      FISH_RUNNER_VLLM_BASE_URL: http://vllm:8000/v1
      FISH_RUNNER_VLLM_API_KEY: ${FISH_VLLM_API_KEY:-change-me-vllm-key}
      FISH_RUNNER_MODELS: ${FISH_VLLM_SERVED_MODEL_NAME:-fish-warm-chat}
      FISH_RUNNER_CONTEXT_TOKENS: ${FISH_VLLM_MAX_MODEL_LEN:-4096}
      FISH_RUNNER_PRICE_USD_PER_1K_TOKENS: ${FISH_RUNNER_PRICE_USD_PER_1K_TOKENS:-0}
      FISH_RUNNER_MAX_QUEUE: ${FISH_RUNNER_MAX_QUEUE:-2}
      FISH_RUNNER_SIGNING_PRIVATE_KEY_PEM: ${FISH_RUNNER_SIGNING_PRIVATE_KEY_PEM:-}
      FISH_RUNNER_SIGNING_KEY_ID: ${FISH_RUNNER_SIGNING_KEY_ID:-runner-ocean-navy-demo-ed25519}
    command:
      - node
      - /app/fish-runner.mjs
    networks:
      - fish-ocean-demo

  fish-runner-mlx:
    image: node:22-slim
    profiles:
      - mlx
    restart: unless-stopped
    working_dir: /app
    ports:
      - "${FISH_RUNNER_BIND:-127.0.0.1}:${FISH_RUNNER_PORT:-8088}:8088"
    volumes:
      - ../warm-inference/fish-runner.mjs:/app/fish-runner.mjs:ro
    environment:
      FISH_RUNNER_HOST: 0.0.0.0
      FISH_RUNNER_PORT: "8088"
      FISH_RUNNER_ID: ${FISH_RUNNER_ID:-runner_ocean_navy_mlx_demo}
      FISH_RUNNER_PROVIDER_ID: ${FISH_RUNNER_PROVIDER_ID:-ocean-navy-local-mlx}
      FISH_RUNNER_API_KEY: ${FISH_RUNNER_API_KEY:-change-me-runner-key}
      FISH_RUNNER_ENGINE_TYPE: mlx
      FISH_RUNNER_VLLM_BASE_URL: ${FISH_MLX_BASE_URL:-http://host.docker.internal:8080/v1}
      FISH_RUNNER_VLLM_API_KEY: ${FISH_MLX_API_KEY:-}
      FISH_RUNNER_MODELS: ${FISH_MLX_MODEL:-mlx-community/Llama-3.2-3B-Instruct-4bit}
      FISH_RUNNER_UPSTREAM_MODEL: ${FISH_MLX_UPSTREAM_MODEL:-mlx-community/Llama-3.2-3B-Instruct-4bit}
      FISH_RUNNER_CONTEXT_TOKENS: ${FISH_MLX_CONTEXT_TOKENS:-4096}
      FISH_RUNNER_PRICE_USD_PER_1K_TOKENS: ${FISH_RUNNER_PRICE_USD_PER_1K_TOKENS:-0}
      FISH_RUNNER_MAX_QUEUE: ${FISH_RUNNER_MAX_QUEUE:-1}
      FISH_RUNNER_SIGNING_PRIVATE_KEY_PEM: ${FISH_RUNNER_SIGNING_PRIVATE_KEY_PEM:-}
      FISH_RUNNER_SIGNING_KEY_ID: ${FISH_RUNNER_SIGNING_KEY_ID:-runner-ocean-navy-mlx-demo-ed25519}
    command:
      - node
      - /app/fish-runner.mjs
    networks:
      - fish-ocean-demo

volumes:
  ocean-typesense-data:
  ocean-node-data:
  ocean-workload-adapter-data:
  vllm-hf-cache:

networks:
  fish-ocean-demo:
    driver: bridge
