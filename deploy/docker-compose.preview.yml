services:
  fish-web:
    build:
      context: ..
      dockerfile: Dockerfile
    image: opfish-web:latest
    env_file:
      - ${FISH_ENV_FILE:-../.env.production}
    expose:
      - "3000"
    volumes:
      - fish-submissions:/app/data/submissions
      - fish-ledger:/app/data/fish
      - fish-ocean-batch:/app/data/ocean-batch
      - fish-proof:/app/data/proof
      - fish-staking:/app/data/staking
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      fish-web:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/auth/.htpasswd:/etc/nginx/auth/.htpasswd:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/api/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  fish-submissions:
  fish-ledger:
  fish-ocean-batch:
  fish-proof:
  fish-staking:
