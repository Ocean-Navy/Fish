map $http_upgrade $connection_upgrade {
  default upgrade;
  "" close;
}

upstream fish_web {
  server fish-web:3000;
  keepalive 32;
}

server {
  listen 80;
  server_name _;
  client_max_body_size 2m;
  # Set this to FISH_PROXY_HEADER_SECRET only when FISH_TRUST_PROXY_HEADERS=true.
  # Keeping it blank strips any user-supplied X-Fish-Proxy-Secret header.
  set $fish_proxy_secret "";

  auth_basic "Fish preview";
  auth_basic_user_file /etc/nginx/auth/.htpasswd;

  location = /api/health {
    auth_basic off;
    proxy_pass http://fish_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Fish-Proxy-Secret $fish_proxy_secret;
  }

  location / {
    proxy_pass http://fish_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Fish-Proxy-Secret $fish_proxy_secret;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }
}
